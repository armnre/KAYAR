<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A0C0E" />
<title>آفلاین هستی | کایار</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: radial-gradient(1200px 600px at 100% -10%, rgba(215,255,31,.12), transparent 60%), #0A0C0E; color: #F2F4F5; font-family: Vazirmatn, Tahoma, system-ui, sans-serif; }
  .card { width: 100%; max-width: 380px; text-align: center; padding: 32px 24px; border-radius: 32px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(12px); }
  .icon { width: 72px; height: 72px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 24px; background: rgba(215,255,31,.14); color: #D7FF1F; }
  h1 { margin: 0 0 8px; font-size: 22px; font-weight: 900; }
  p { margin: 0 0 24px; color: #9AA3AB; line-height: 1.9; font-size: 15px; }
  button { width: 100%; height: 52px; border: 0; border-radius: 18px; background: #D7FF1F; color: #0A0C0E; font: inherit; font-weight: 800; font-size: 16px; cursor: pointer; transition: transform .15s; }
  button:active { transform: scale(.97); }
  .brand { margin-top: 20px; font-size: 12px; letter-spacing: .3em; color: #59626A; font-weight: 800; }
</style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><path d="m2 2 20 20"/></svg>
    </div>
    <h1>اتصال اینترنت قطع است</h1>
    <p>به نظر می‌رسد آفلاین هستی. اتصال را بررسی کن و دوباره امتحان کن؛ همه‌چیز سر جایش منتظرت است.</p>
    <button type="button" onclick="location.reload()">تلاش مجدد</button>
    <div class="brand">KAYAR</div>
  </main>
  <script>addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
