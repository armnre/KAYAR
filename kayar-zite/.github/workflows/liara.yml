name: Deploy to Liara
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          npm i -g @liara/cli@latest
          liara deploy --app="${{ vars.LIARA_APP || 'kayar' }}" --api-token="$LIARA_TOKEN" --platform=docker --port=80 --detach
